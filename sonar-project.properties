# ===============================
# Project Identification
# ===============================
sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness & Gym Management
sonar.projectVersion=1.0

# ===============================
# Source Code Settings
# ===============================
sonar.sources=app
sonar.sourceEncoding=UTF-8

# ===============================
# Test Settings
# ===============================
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# ===============================
# Python Configuration
# ===============================
sonar.language=py
sonar.python.version=3.10

# ===============================
# Coverage Reports (Pytest + Coverage)
# ===============================
sonar.python.coverage.reportPaths=coverage.xml

# ===============================
# Exclusions
# ===============================
sonar.exclusions=**/__pycache__/**,**/*.pyc,venv/**

# ===============================
# SonarQube Server
# ===============================
sonar.host.url=http://host.docker.internal:9000

# Replace with your generated token
sonar.token=sqa_3d3de036e8fd1e7f5e75b7c2ff59ffccda6b00a9